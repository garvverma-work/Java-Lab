# ===================================================================
# ShopNest — Online Shopping Store Application Configuration
# ===================================================================

# Application Information
spring.application.name=ShopNest
server.port=8080

# -------------------------------------------------------------------
# H2 File-Based Database Configuration (Works 100% offline on PC)
# -------------------------------------------------------------------
# Stores database file in ./data/shopnestdb.mv.db inside project directory
spring.datasource.url=jdbc:h2:file:./data/shopnestdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
# 'update' automatically creates/updates database tables based on Java Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# H2 Web Console Configuration (Accessible at http://localhost:8080/h2-console)
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
# Disable cache so changes in HTML files reflect immediately on page reload
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# -------------------------------------------------------------------
# Static Resources Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# HTTP Session Configuration
# -------------------------------------------------------------------
# Keep shopping cart active for 7 days if browser remains open
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=SHOPNEST_SESSION

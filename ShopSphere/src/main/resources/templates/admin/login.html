<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head-meta('Admin Login — ShopNest')}"></head>
<body class="bg-light">

<!-- Minimal Navigation Bar -->
<header class="bg-white border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand sn-brand" th:href="@{/}">
            <span class="sn-brand-icon"><i class="bi bi-bag-heart-fill"></i></span>
            ShopNest
        </a>
        <a th:href="@{/}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Store
        </a>
    </div>
</header>

<!-- Floating Alerts -->
<div th:replace="~{fragments/alerts :: alert-messages}"></div>

<main class="py-5 d-flex align-items-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 440px;">
        <div class="bg-white border rounded-4 shadow p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="sn-brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold mb-1">Admin Portal</h3>
                <p class="text-muted small">Sign in to manage catalog &amp; customer orders</p>
            </div>

            <!-- Demo Credentials Helper Callout -->
            <div class="alert alert-info py-2 px-3 small border-0 bg-info-subtle text-info-emphasis rounded-3 mb-4">
                <div class="fw-bold"><i class="bi bi-info-circle me-1"></i> Default Demo Credentials:</div>
                <div class="font-monospace">admin@shopnest.com</div>
                <div class="font-monospace">admin123</div>
            </div>

            <!-- Login Form -->
            <form th:action="@{/admin/login}" th:object="${loginDto}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label small fw-bold">Admin Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" 
                               placeholder="admin@shopnest.com" required autofocus>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold">Admin Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" id="password" th:field="*{password}" class="form-control border-start-0" 
                               placeholder="••••••••" required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard
                </button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">
                    Secured by Spring Boot &bull; College Project Demo
                </small>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

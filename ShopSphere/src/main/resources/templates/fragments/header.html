<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head-meta(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — ShopNest Online Store'">ShopNest — Online Shopping Store</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Header Navigation Bar -->
<header th:fragment="navbar" class="sn-navbar">
    <nav class="navbar navbar-expand-lg py-2">
        <div class="container">
            <!-- Brand Logo & Name -->
            <a class="navbar-brand sn-brand me-4" th:href="@{/}">
                <span class="sn-brand-icon"><i class="bi bi-bag-heart-fill"></i></span>
                ShopNest
            </a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links & Search -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Search Bar Form -->
                <form class="d-flex mx-lg-auto my-2 my-lg-0 sn-search-box" th:action="@{/products}" method="get">
                    <i class="bi bi-search sn-search-icon"></i>
                    <input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Search products, brands, electronics..." aria-label="Search">
                </form>

                <!-- Navigation Links -->
                <ul class="navbar-nav ms-lg-auto align-items-lg-center gap-1 my-2 my-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}"><i class="bi bi-grid me-1"></i> Catalog</a>
                    </li>

                    <!-- Categories Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-tags me-1"></i> Categories
                        </a>
                        <ul class="dropdown-menu shadow-sm border-0" aria-labelledby="categoryDropdown">
                            <li><a class="dropdown-item py-2" th:href="@{/products(category='All')}">All Products</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li th:each="cat : ${navCategories}">
                                <a class="dropdown-item py-2" th:href="@{/products(category=${cat})}" th:text="${cat}">Category</a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}"><i class="bi bi-info-circle me-1"></i> About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}"><i class="bi bi-envelope me-1"></i> Contact</a>
                    </li>

                    <!-- Shopping Cart Button with Dynamic Item Badge -->
                    <li class="nav-item ms-lg-2 my-2 my-lg-0">
                        <a th:href="@{/cart}" class="sn-cart-badge-btn text-decoration-none">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span>Cart</span>
                            <span class="sn-cart-counter ms-1" th:text="${cartItemCount}">0</span>
                        </a>
                    </li>

                    <!-- Admin Portal Link -->
                    <li class="nav-item ms-lg-2">
                        <a th:href="@{/admin}" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

</body>
</html>
